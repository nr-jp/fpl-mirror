name: mirror

on:
  schedule:
    # two slots per hour: GitHub's scheduler skipped 5 of the first 6 hourly runs on 14 Sep 2026.
    # concurrency below stops them overlapping; a run with no data changes commits nothing.
    - cron: "12 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "mirror.py"
      - ".github/workflows/mirror.yml"

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch FPL API
        run: python mirror.py
      - name: Commit
        run: |
          git config user.name "fpl-mirror"
          git config user.email "fpl-mirror@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "mirror $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          fi
